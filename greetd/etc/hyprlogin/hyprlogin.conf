# Catppuccin Mocha theme for hyprlogin (greetd greeter)
# Same visual as hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = true
    no_fade_out = true
}

auth {
    pam:enabled = true
}

background {
    monitor =
    path = /usr/share/backgrounds/anime-girl.png
    color = rgba(17, 17, 27, 1.0)
    blur_passes = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(205, 214, 244, 0.9)
    font_size = 48
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A %d %B %Y')"
    color = rgba(147, 153, 178, 0.8)
    font_size = 16
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(137, 180, 250, 0.6)
    inner_color = rgba(49, 50, 68, 0.8)
    font_color = rgba(205, 214, 244, 0.95)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
