# Catppuccin Mocha theme for hyprlock
# Same visual as hyprlogin.conf (greetd greeter)

general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = true
    no_fade_out = true
}

auth {
    pam:enabled = true
}

background {
    monitor =
    path = /home/skydogzz/.config/hypr/wallpapers/Anime Girl Wallpaper.jpeg
    color = rgba(17, 17, 27, 1.0)
    blur_passes = 2
}

label {
    monitor =
    text = <span font_desc="Sans 32">  Locked</span>
    color = rgba(205, 214, 244, 0.9)
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(137, 180, 250, 0.6)
    inner_color = rgba(49, 50, 68, 0.8)
    font_color = rgba(205, 214, 244, 0.95)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
