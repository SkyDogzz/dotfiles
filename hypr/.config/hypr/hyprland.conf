# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua



$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/rofi-launcher.sh

source = ~/.config/hypr/hyprmonitors.conf
source = ~/.config/hypr/hyprtheme.conf

# Fallback background color in case hyprpaper leaves a gap.
# Disable the random splash text and logo overlay.
misc {
    background_color = 0x0c0e12
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Restart Waybar on config reload too.
exec = pkill waybar || true; waybar

# Restart hyprpaper on config reload too.
exec = pkill hyprpaper || true; hyprpaper -c ~/.config/hypr/hyprpaper.conf

# Start udiskie on login/reload.
exec = pkill udiskie || true; udiskie

# Start dunst on login/reload.
exec = pkill dunst || true; dunst

# Start cliphist on login/reload.
exec = pkill wl-paste || true; wl-paste --watch cliphist store

# Start hypridle on login/reload.
exec = pkill hypridle || true; hypridle

# Set GTK dark theme via dconf (persists across reboots).
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita'

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, E, exec, wlogout
bind = $mainMod, V, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/rofi-launcher.sh clipboard
bind = $mainMod SHIFT, V, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/clipboard-clear.sh clear
bind = $mainMod CTRL SHIFT, V, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/clipboard-clear.sh wipe
bind = $mainMod, F, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod SHIFT, C, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/caffeine.sh toggle
bind = $mainMod, W, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/wallpaper.sh next
bind = $mainMod SHIFT, W, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/rofi-launcher.sh wallpaper

bind = $mainMod, S, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/screenshot.sh full
bind = $mainMod SHIFT, S, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/screenshot.sh region
bind = $mainMod CTRL, S, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/screenshot.sh window
bind = $mainMod ALT, S, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/screenshot.sh edit

bindel = , XF86AudioRaiseVolume, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/audio.sh up
bindel = , XF86AudioLowerVolume, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/audio.sh down
bindl = , XF86AudioMute, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/audio.sh mute
bindl = , XF86AudioMicMute, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/audio.sh mic-mute
bindel = , XF86MonBrightnessUp, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, /home/skydogzz/dotfiles/hypr/.config/hypr/scripts/brightness.sh down
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

