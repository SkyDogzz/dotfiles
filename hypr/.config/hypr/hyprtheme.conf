# Catppuccin Mocha theme for Hyprland.
# https://github.com/catppuccin/hyprland

env = GTK_THEME,Adwaita:dark
env = XCURSOR_THEME,breeze-dark
env = XCURSOR_SIZE,24

general {
    gaps_in = 5
    gaps_out = 18
    border_size = 2
    col.active_border = rgba(89b4faff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(45475add)
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 0.98
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(00000077)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.15
    }
}

animations {
    enabled = true
}
