# ── Floating windows ──
windowrule = match:class ^(org\.twosheds\.iwgtk|iwgtk)$, float on, center on
windowrule = match:class ^(blueberry\.py|Blueberry\.py)$, float on, center on
windowrule = match:class xdg-desktop-portal, float on
windowrule = match:class wlogout, float on
windowrule = match:title Picture-in-Picture, float on, center on, pin on

# ── Appearance ──
windowrule = match:class waybar, no_blur on
windowrule = match:class rofi, no_blur on
windowrule = match:fullscreen true, border_size 0
windowrule = match:class kitty, opacity 0.96 0.92
