set -g mouse on

# Catppuccin Mocha palette
set -g status-style "bg=colour0,fg=colour15"
set -g message-style "bg=colour8,fg=colour15"
set -g message-command-style "bg=colour8,fg=colour15"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour12"
set -g window-status-style "bg=colour0,fg=colour7"
set -g window-status-current-style "bg=colour12,fg=colour0,bold"
set -g status-left-style "bg=colour13,fg=colour0,bold"
set -g status-right-style "bg=colour8,fg=colour15"
set -g clock-mode-colour "colour12"
set -g mode-style "bg=colour11,fg=colour0,bold"
